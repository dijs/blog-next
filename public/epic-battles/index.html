<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Epic Battles</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#101b17; color:#dce8e8; font:14px system-ui,sans-serif; }
    #game { width:100%; height:100%; position:relative; }
    canvas { width:100%; height:100%; display:block; outline:none; touch-action:none; }
    #loading { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; }
  </style>
</head>
<body>
  <main id="game">
    <canvas id="battle-canvas" tabindex="0" aria-label="Epic Battles interactive battlefield"></canvas>
    <div id="loading" role="status">Loading Epic Battles…</div>
  </main>
  <script type="module">
    import init from './pkg/epic_battles.js';
    const canvas = document.querySelector('#battle-canvas');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('wheel', event => event.preventDefault(), {passive:false});
    canvas.addEventListener('pointerdown', event => {
      canvas.focus({preventScroll:true});
      if (event.button === 1) event.preventDefault();
    });
    try {
      await init();
      document.querySelector('#loading').remove();
    } catch (error) {
      document.querySelector('#loading').textContent = 'Unable to start Epic Battles. This browser needs WebGL 2 enabled.';
      console.error(error);
    }
  </script>
</body>
</html>
